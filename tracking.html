<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lacak Kiriman | Aksara Quest</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="tracking">
<header class="atas">
  <a class="merek" href="dashboard.html"><img src="assets/logo.svg" alt="">Aksara Quest</a>
  <nav aria-label="Menu utama">
    <a href="dashboard.html">Beranda</a>
    <a href="stok.html">Katalog</a>
    <a href="checkout.html#pesan">Pesanan</a>
    <a href="tracking.html">Lacak</a>
  </nav>
  <div class="hud">
    <span class="avatar" id="avatar" aria-hidden="true"></span>
    <div class="hud-info"><strong id="namaUser"></strong><span id="levelUser"></span><div class="xp kecil" role="progressbar" aria-label="Pengalaman"><i id="xpBar"></i></div></div>
    <span class="koin" id="koinUser" title="Total belanja dalam ribu rupiah">0</span>
    <button type="button" id="keluar" class="btn garis mini">Keluar</button>
  </div>
</header>
<main class="isi">
  <h1>Lacak Kiriman</h1>
  <section class="panel" aria-labelledby="jCari" style="margin-top:1.2rem">
    <h2 id="jCari">Masukkan nomor Delivery Order</h2>
    <form id="formTrack" class="cari-do" novalidate>
      <div><label for="nomorDO" style="margin-top:0">Nomor DO</label><input id="nomorDO" inputmode="numeric" placeholder="20230012"><p class="galat" id="err-nomorDO"></p></div>
      <button type="submit" class="btn" style="margin-top:1.55rem">Cari</button>
    </form>
    <p class="ket">Coba nomor: <button type="button" class="chip" data-contoh="20230012">20230012</button> <button type="button" class="chip" data-contoh="20230013">20230013</button></p>
  </section>
  <div id="hasil" aria-live="polite"></div>
</main>
<footer class="kaki">Aksara Quest &ndash; proyek UTS Pemrograman Web 1. Kumpulkan buku, naikkan level.</footer>
<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
